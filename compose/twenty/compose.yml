services:

  server:
    image: twentycrm/twenty:${TAG:-latest}
    container_name: autilux-twenty
    restart: unless-stopped

    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage

    environment:
      NODE_PORT: 3000

      PG_DATABASE_URL: postgres://${PG_DATABASE_USER}:${PG_DATABASE_PASSWORD}@${PG_DATABASE_HOST}:${PG_DATABASE_PORT}/${PG_DATABASE_NAME}

      SERVER_URL: ${SERVER_URL}

      REDIS_URL: ${REDIS_URL}

      DISABLE_DB_MIGRATIONS: ${DISABLE_DB_MIGRATIONS}
      DISABLE_CRON_JOBS_REGISTRATION: ${DISABLE_CRON_JOBS_REGISTRATION}

      STORAGE_TYPE: ${STORAGE_TYPE}

      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY}

      APP_SECRET: ${APP_SECRET}

    labels:
      - traefik.enable=true

      - traefik.http.routers.twenty.rule=Host(`crm.autilux.com`)
      - traefik.http.routers.twenty.entrypoints=websecure
      - traefik.http.routers.twenty.tls=true
      - traefik.http.routers.twenty.tls.certresolver=letsencrypt

      - traefik.http.services.twenty.loadbalancer.server.port=3000

    networks:
      - autilux

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    image: twentycrm/twenty:${TAG:-latest}
    container_name: autilux-twenty-worker
    restart: unless-stopped

    command: ["yarn", "worker:prod"]

    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage

    environment:
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER}:${PG_DATABASE_PASSWORD}@${PG_DATABASE_HOST}:${PG_DATABASE_PORT}/${PG_DATABASE_NAME}

      SERVER_URL: ${SERVER_URL}

      REDIS_URL: ${REDIS_URL}

      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"

      STORAGE_TYPE: ${STORAGE_TYPE}

      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY}

      APP_SECRET: ${APP_SECRET}

    networks:
      - autilux

    depends_on:
      server:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: autilux-twenty-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME}
      POSTGRES_USER: ${PG_DATABASE_USER}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}

    volumes:
      - db-data:/var/lib/postgresql/data

    networks:
      - autilux

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_DATABASE_USER} -h localhost -d ${PG_DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis
    container_name: autilux-twenty-redis
    restart: unless-stopped

    command: ["redis-server", "--maxmemory-policy", "noeviction"]

    volumes:
      - redis-data:/data

    networks:
      - autilux

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  redis-data:
  server-local-data:

networks:
  autilux:
    external: true
